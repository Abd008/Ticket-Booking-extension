<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QT Tatkal Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 320px;
            padding: 12px;
        }

        .passenger {
            border: 1px solid #ddd;
            padding: 8px;
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-top: 6px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
        }

        button {
            margin-top: 8px;
            padding: 8px 10px;
        }
    </style>
</head>

<body>
    <h2>QT Tatkal Assistant</h2>

    <div style="margin-bottom:8px;">
        <label>From<input id="fromInput" placeholder="From station"></label>
        <label>To<input id="toInput" placeholder="To station"></label>
        <label>Journey Date<input id="journeyDate" type="date"></label>
        <label>Train Number<input id="trainNumber" placeholder="Train number or name"></label>
        <label>Payment
            <select id="paymentMode">
                <option value="">(select)</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
                <option value="Netbanking">Netbanking</option>
            </select>
        </label>
    </div>

    <div id="passengers"></div>
    <button id="addPassenger">Add passenger</button>
    <div style="margin-top:8px;">
        <button id="save">Save</button>
        <button id="fillNow">Fill Now</button>
        <button id="startAuto">Start Automation</button>
        <button id="stopAuto">Stop Automation</button>
    </div>

    <p id="status" style="font-size:12px;color:#666;margin-top:8px;"></p>

    <h3 style="font-size:13px;margin-top:12px;">Live logs</h3>
    <div id="logs"
        style="height:160px;overflow:auto;border:1px solid #eee;padding:6px;background:#fafafa;font-size:12px;"></div>
    <div style="margin-top:6px;"><button id="clearLogs">Clear Logs</button></div>

    <script src="popup.js"></script>
</body>

</html>
